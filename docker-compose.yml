# Local CodeRabbit - Docker Compose
# Run with: docker-compose up -d

version: '3.8'

services:
  local-rabbit:
    build: .
    container_name: local-coderabbit
    ports:
      - "8765:8765"
    environment:
      - PORT=8765
    env_file:
      - .env
    volumes:
      # Mount .agent folder for live updates to rules
      - ./.agent:/app/.agent:ro
      # Mount prompts for customization
      - ./prompts.json:/app/prompts.json:ro
      # Mount data for persistent feedback
      - ./data:/app/data
      # Mount scripts for live code updates
      - ./scripts:/app/scripts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Dashboard server
  dashboard:
    build: .
    container_name: local-coderabbit-dashboard
    command: ["python", "scripts/server.py"]
    ports:
      - "8080:8080"
    volumes:
      - ./reviews:/app/reviews:ro
      - ./dashboard.html:/app/dashboard.html:ro
    restart: unless-stopped
    depends_on:
      - local-rabbit
