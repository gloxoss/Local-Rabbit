<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local CodeRabbit — Configure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #111113;
            --surface-hover: #18181b;
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(34, 197, 94, 0.5);
            --text: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
            --accent: #22c55e;
            --critical: #ef4444;
            --warning: #eab308;
            --info: #0ea5e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Geist', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 48px 32px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--text-secondary);
        }

        .back-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .btn svg {
            width: 15px;
            height: 15px;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            animation: fadeUp 0.5s ease backwards;
        }

        .card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .card:nth-child(2) {
            animation-delay: 0.2s;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title svg {
            width: 16px;
            height: 16px;
            color: var(--text-muted);
        }

        /* Textarea */
        textarea {
            width: 100%;
            min-height: 200px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            color: var(--text);
            font-family: 'Geist Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.15s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        /* Rules List */
        .rules-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rule-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--bg);
            border: 1px solid transparent;
            border-radius: 10px;
            transition: all 0.15s ease;
        }

        .rule-item:hover {
            border-color: var(--border);
        }

        .rule-item:focus-within {
            border-color: var(--border-focus);
        }

        .severity-select {
            width: 40px;
            height: 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
            text-align: center;
            cursor: pointer;
            appearance: none;
            transition: all 0.15s ease;
        }

        .severity-select:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .severity-select:focus {
            outline: none;
            border-color: var(--border-focus);
        }

        .rule-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: 'Geist Mono', monospace;
            font-size: 13px;
        }

        .rule-input:focus {
            outline: none;
        }

        .rule-input::placeholder {
            color: var(--text-muted);
        }

        .btn-remove {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.15s ease;
            opacity: 0;
        }

        .rule-item:hover .btn-remove {
            opacity: 1;
        }

        .btn-remove:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--critical);
        }

        .btn-remove svg {
            width: 14px;
            height: 14px;
        }

        .btn-add {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text-muted);
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .btn-add:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-add svg {
            width: 14px;
            height: 14px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            padding: 12px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast svg {
            width: 16px;
            height: 16px;
            color: var(--accent);
        }

        /* Severity Indicator */
        .severity-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .severity-dot--critical {
            background: var(--critical);
        }

        .severity-dot--warning {
            background: var(--warning);
        }

        .severity-dot--suggestion {
            background: var(--info);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .container {
                padding: 24px 16px;
            }

            .header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
            }

            .header-actions .btn {
                flex: 1;
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="back-btn" onclick="window.open('dashboard.html', '_self')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                </button>
                <div class="header-title">
                    <h1>Prompt Configuration</h1>
                    <p>Customize your AI code review behavior</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn" onclick="loadDefaults()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                        <path d="M21 3v5h-5" />
                    </svg>
                    Reset
                </button>
                <button class="btn btn-primary" onclick="savePrompts()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                        <polyline points="17 21 17 13 7 13 7 21" />
                        <polyline points="7 3 7 8 15 8" />
                    </svg>
                    Save
                </button>
            </div>
        </header>

        <!-- Review Prompt Card -->
        <section class="card">
            <div class="card-header">
                <h2 class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </svg>
                    Review Prompt
                </h2>
            </div>
            <textarea id="reviewPrompt" placeholder="Enter your custom review prompt...">You are a Senior Code Reviewer. Review the code below following these EXACT rules.

OUTPUT FORMAT (use these exact prefixes):
CRITICAL: [security/bug issue]
WARNING: [code smell/bad practice]
SUGGESTION: [improvement]

Be concise. Max 5 points.</textarea>
        </section>

        <!-- Custom Rules Card -->
        <section class="card">
            <div class="card-header">
                <h2 class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6" />
                        <line x1="8" y1="12" x2="21" y2="12" />
                        <line x1="8" y1="18" x2="21" y2="18" />
                        <line x1="3" y1="6" x2="3.01" y2="6" />
                        <line x1="3" y1="12" x2="3.01" y2="12" />
                        <line x1="3" y1="18" x2="3.01" y2="18" />
                    </svg>
                    Custom Rules
                </h2>
            </div>
            <div class="rules-list" id="rulesList"></div>
            <button class="btn-add" onclick="addRule()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Add Rule
            </button>
        </section>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
        </svg>
        Saved successfully
    </div>

    <script>
        const defaultRules = [
            { text: 'No `any` type in TypeScript', severity: 'critical' },
            { text: 'Prefer `const` over `let`', severity: 'warning' },
            { text: 'Use functional patterns (map, filter, reduce)', severity: 'suggestion' },
            { text: 'Validate all inputs with Zod or Pydantic', severity: 'critical' },
            { text: 'Check for N+1 queries', severity: 'warning' }
        ];

        let rules = [...defaultRules];

        const severityIcons = {
            critical: '●',
            warning: '●',
            suggestion: '●'
        };

        function renderRules() {
            const container = document.getElementById('rulesList');
            container.innerHTML = rules.map((rule, i) => `
                <div class="rule-item">
                    <div class="severity-dot severity-dot--${rule.severity}"></div>
                    <select class="severity-select" onchange="updateSeverity(${i}, this.value)" title="Severity">
                        <option value="critical" ${rule.severity === 'critical' ? 'selected' : ''}>C</option>
                        <option value="warning" ${rule.severity === 'warning' ? 'selected' : ''}>W</option>
                        <option value="suggestion" ${rule.severity === 'suggestion' ? 'selected' : ''}>S</option>
                    </select>
                    <input type="text" class="rule-input" value="${rule.text}" 
                           onchange="updateText(${i}, this.value)" placeholder="Enter rule...">
                    <button class="btn-remove" onclick="removeRule(${i})" title="Remove">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        function addRule() {
            rules.push({ text: '', severity: 'suggestion' });
            renderRules();
            // Focus the new input
            const inputs = document.querySelectorAll('.rule-input');
            inputs[inputs.length - 1].focus();
        }

        function removeRule(index) {
            rules.splice(index, 1);
            renderRules();
        }

        function updateText(index, text) {
            rules[index].text = text;
        }

        function updateSeverity(index, severity) {
            rules[index].severity = severity;
            renderRules();
        }

        function loadDefaults() {
            document.getElementById('reviewPrompt').value = `You are a Senior Code Reviewer. Review the code below following these EXACT rules.

OUTPUT FORMAT (use these exact prefixes):
CRITICAL: [security/bug issue]
WARNING: [code smell/bad practice]
SUGGESTION: [improvement]

Be concise. Max 5 points.`;
            rules = [...defaultRules];
            renderRules();
        }

        async function savePrompts() {
            const data = {
                review_prompt: document.getElementById('reviewPrompt').value,
                custom_rules: rules.filter(r => r.text.trim()).map(r => r.text)
            };

            const toast = document.getElementById('toast');

            try {
                // Try saving via custom server API
                const response = await fetch('/api/save-prompt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    toast.innerHTML = `
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12" />
                        </svg> Saved successfully to disk!`;
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2500);
                    return;
                }
                throw new Error('API unavailable');
            } catch (e) {
                console.log('API save failed, falling back to download', e);
                // Fallback to download
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'prompts.json';
                a.click();
                URL.revokeObjectURL(url);

                toast.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg> Downloaded (Manual Save Required)`;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }
        }

        async function init() {
            try {
                const response = await fetch('prompts.json');
                if (response.ok) {
                    const data = await response.json();
                    if (data.review_prompt) {
                        document.getElementById('reviewPrompt').value = data.review_prompt;
                    }
                    if (data.custom_rules) {
                        rules = data.custom_rules.map(text => ({ text, severity: 'suggestion' }));
                    }
                }
            } catch (e) {
                // Use defaults
            }
            renderRules();
        }

        init();
    </script>
</body>

</html>
